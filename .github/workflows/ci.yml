name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: "6.3"

      - name: Swift Version
        run: swift --version

      - name: Install Lint Tools
        run: brew install swiftformat swiftlint

      - name: Run Tests
        run: swift test

      - name: Run Examples
        run: scripts/examples.sh

      - name: Build Documentation
        run: scripts/docs.sh

      - name: Run Lint
        run: scripts/lint.sh
