included:
  - Examples
  - Sources
  - Tests

excluded:
  - .build
  - Examples/*/.build
  - Sources/CKomaSQLite

analyzer_rules:
  - unused_declaration
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - identical_operands
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - force_cast # Fast-path internals use type-checked casts after explicit type checks.
  - force_try # Macro/relationship internals resolve generated metadata that should be programmer errors if missing.
  - modifier_order # Keep SwiftFormat as the single style source of truth.
  - opening_brace # SwiftFormat's multiline generic/where wrapping is the source of truth.
  - optional_data_string_conversion # JSON scanner intentionally uses non-failable UTF-8 decoding in validated hot paths.
  - todo
  - unneeded_synthesized_initializer # @KomaEntity records need explicit test initializers because macros suppress memberwise init at use sites.

line_length:
  warning: 180
  error: 220
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 120
  error: 180

cyclomatic_complexity:
  warning: 30
  error: 40

large_tuple:
  warning: 4
  error: 5

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

identifier_name:
  min_length:
    warning: 1
  allowed_symbols:
    - _
  validates_start_with_lowercase: false
  excluded:
    - id
    - AddColumn
    - AddIndex
    - CreateTable
    - DropColumn
    - Migration
    - RenameColumn
    - RenameTable

type_name:
  allowed_symbols:
    - _
  max_length:
    warning: 60
    error: 100

nesting:
  type_level:
    warning: 2
